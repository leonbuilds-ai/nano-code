<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-label="上下文外置与回读">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1722"/><stop offset="1" stop-color="#102b32"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#55c8cf" stroke-width="2"/></marker></defs>
<rect width="1200" height="510" rx="22" fill="url(#bg)"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="54" y="62" fill="#f3faf8" font-size="31" font-weight="700">上下文外置与回读</text><text x="54" y="94" fill="#a9c7c7" font-size="17">缩短发送给模型的文本，同时保留本地原始记录</text><rect x="52" y="148" width="259" height="118" rx="16" fill="#14343e" stroke="#47c3cc" stroke-width="2"/><rect x="52" y="148" width="5" height="118" rx="2" fill="#47c3cc"/><text x="74" y="182" fill="#effbf7" font-size="21" font-weight="700">工具输出</text><text x="74" y="213" fill="#b9d5d2" font-size="17">超过长度阈值</text><rect x="397" y="148" width="329" height="118" rx="16" fill="#14343e" stroke="#47c3cc" stroke-width="2"/><rect x="397" y="148" width="5" height="118" rx="2" fill="#47c3cc"/><text x="419" y="182" fill="#effbf7" font-size="21" font-weight="700">SHA-256 内容引用</text><text x="419" y="213" fill="#b9d5d2" font-size="17">消息中只保留 ref</text><rect x="813" y="148" width="331" height="118" rx="16" fill="#14343e" stroke="#75dcaa" stroke-width="2"/><rect x="813" y="148" width="5" height="118" rx="2" fill="#75dcaa"/><text x="835" y="182" fill="#effbf7" font-size="21" font-weight="700">本地输出对象</text><text x="835" y="213" fill="#b9d5d2" font-size="17">按内容散列保存全文</text><path d="M311 207 L393 207" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M726 207 L809 207" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="52" y="344" width="305" height="113" rx="16" fill="#14343e" stroke="#47c3cc" stroke-width="2"/><rect x="52" y="344" width="5" height="113" rx="2" fill="#47c3cc"/><text x="74" y="378" fill="#effbf7" font-size="21" font-weight="700">模型上下文</text><text x="74" y="409" fill="#b9d5d2" font-size="17">近期消息 + 引用</text><rect x="439" y="344" width="305" height="113" rx="16" fill="#14343e" stroke="#75dcaa" stroke-width="2"/><rect x="439" y="344" width="5" height="113" rx="2" fill="#75dcaa"/><text x="461" y="378" fill="#effbf7" font-size="21" font-weight="700">recall_output</text><text x="461" y="409" fill="#b9d5d2" font-size="17">按偏移与长度读取</text><rect x="826" y="344" width="318" height="113" rx="16" fill="#14343e" stroke="#75dcaa" stroke-width="2"/><rect x="826" y="344" width="5" height="113" rx="2" fill="#75dcaa"/><text x="848" y="378" fill="#effbf7" font-size="21" font-weight="700">校验后返回片段</text><text x="848" y="409" fill="#b9d5d2" font-size="17">引用格式 + 内容散列</text><path d="M204 266 L204 340" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M357 400 L435 400" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M744 400 L822 400" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M984 344 L984 296 L979 296 L979 270" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="775" y="312" fill="#a9c7c7" font-size="16">较早历史按消息组归档，摘要留在上下文</text></g></svg>
