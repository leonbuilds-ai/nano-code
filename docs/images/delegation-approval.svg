<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-label="子任务与审批">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1722"/><stop offset="1" stop-color="#102b32"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#55c8cf" stroke-width="2"/></marker></defs>
<rect width="1200" height="510" rx="22" fill="url(#bg)"/>
<g font-family="Noto Sans CJK SC,Microsoft YaHei,PingFang SC,sans-serif"><text x="54" y="62" fill="#f3faf8" font-size="31" font-weight="700">子任务与审批</text><text x="54" y="94" fill="#a9c7c7" font-size="17">主任务分派有界工作；修改和命令由用户决定</text><rect x="53" y="148" width="252" height="112" rx="16" fill="#14343e" stroke="#47c3cc" stroke-width="2"/><rect x="53" y="148" width="5" height="112" rx="2" fill="#47c3cc"/><text x="75" y="182" fill="#effbf7" font-size="21" font-weight="700">主 Agent</text><text x="75" y="213" fill="#b9d5d2" font-size="17">最多 3 个子任务</text><rect x="382" y="133" width="331" height="133" rx="16" fill="#14343e" stroke="#75dcaa" stroke-width="2"/><rect x="382" y="133" width="5" height="133" rx="2" fill="#75dcaa"/><text x="404" y="167" fill="#effbf7" font-size="21" font-weight="700">Fork / Team</text><text x="404" y="198" fill="#b9d5d2" font-size="17">只读任务，可并行</text><text x="404" y="224" fill="#b9d5d2" font-size="17">不能写入、运行命令或再委派</text><rect x="790" y="133" width="354" height="133" rx="16" fill="#14343e" stroke="#75dcaa" stroke-width="2"/><rect x="790" y="133" width="5" height="133" rx="2" fill="#75dcaa"/><text x="812" y="167" fill="#effbf7" font-size="21" font-weight="700">Worktree</text><text x="812" y="198" fill="#b9d5d2" font-size="17">从当前 HEAD 创建隔离分支</text><text x="812" y="224" fill="#b9d5d2" font-size="17">创建工作树前需批准</text><path d="M305 202 L378 202" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M305 214 L350 214 L350 293 L966 293 L966 270" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="382" y="353" width="331" height="105" rx="16" fill="#14343e" stroke="#47c3cc" stroke-width="2"/><rect x="382" y="353" width="5" height="105" rx="2" fill="#47c3cc"/><text x="404" y="387" fill="#effbf7" font-size="21" font-weight="700">只读结果</text><text x="404" y="418" fill="#b9d5d2" font-size="17">返回主任务复核</text><rect x="790" y="353" width="354" height="105" rx="16" fill="#14343e" stroke="#47c3cc" stroke-width="2"/><rect x="790" y="353" width="5" height="105" rx="2" fill="#47c3cc"/><text x="812" y="387" fill="#effbf7" font-size="21" font-weight="700">分支与工作树路径</text><text x="812" y="418" fill="#b9d5d2" font-size="17">写入 / 命令仍需逐次审批</text><path d="M548 266 L548 349" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M967 297 L967 349" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M382 406 L305 406 L305 253" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M790 406 L345 406 L345 272 L305 272" stroke="#55c8cf" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="535" y="486" fill="#a9c7c7" font-size="16">结果不会自动合并</text></g></svg>
